spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${ERP_DB_URL}
    username: ${ERP_DB_USERNAME}
    password: ${ERP_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
erp:
  auth:
    session-ttl: ${ERP_AUTH_SESSION_TTL:PT12H}
    ticket-ttl: ${ERP_AUTH_TICKET_TTL:PT60S}
  file:
    storage:
      provider: ${ERP_FILE_STORAGE_PROVIDER:local}
