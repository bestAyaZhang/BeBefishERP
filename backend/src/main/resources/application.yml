spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${ERP_DB_URL}
    username: ${ERP_DB_USERNAME}
    password: ${ERP_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
erp:
  shipping:
    ane:
      enabled: ${ERP_ANE_ENABLED:false}
      order-url: ${ERP_ANE_ORDER_URL:https://opc.test.ane56.com/aneop/opwb/lb/new}
      code: ${ERP_ANE_CODE:}
      app-key: ${ERP_ANE_APP_KEY:}
      customer-code: ${ERP_ANE_CUSTOMER_CODE:}
      customer-pass: ${ERP_ANE_CUSTOMER_PASS:}
      dict-id: ${ERP_ANE_DICT_ID:}
      sender-name: ${ERP_ANE_SENDER_NAME:}
      sender-phone: ${ERP_ANE_SENDER_PHONE:}
      sender-province: ${ERP_ANE_SENDER_PROVINCE:}
      sender-city: ${ERP_ANE_SENDER_CITY:}
      sender-county: ${ERP_ANE_SENDER_COUNTY:}
      sender-address: ${ERP_ANE_SENDER_ADDRESS:}
  auth:
    session-ttl: ${ERP_AUTH_SESSION_TTL:PT12H}
    ticket-ttl: ${ERP_AUTH_TICKET_TTL:PT60S}
    oauth-state-ttl: ${ERP_AUTH_OAUTH_STATE_TTL:PT5M}
    local-admin:
      enabled: ${ERP_LOCAL_ADMIN_ENABLED:false}
      mobile: ${ERP_LOCAL_ADMIN_MOBILE:}
      password: ${ERP_LOCAL_ADMIN_PASSWORD:}
  feishu:
    enabled: ${ERP_FEISHU_ENABLED:false}
    app-id: ${ERP_FEISHU_APP_ID:}
    app-secret: ${ERP_FEISHU_APP_SECRET:}
    redirect-uri: ${ERP_FEISHU_REDIRECT_URI:}
    allowed-tenant-key: ${ERP_FEISHU_ALLOWED_TENANT_KEY:}
    business-roles: ${ERP_FEISHU_BUSINESS_ROLES:}
    mock-enabled: ${ERP_FEISHU_MOCK_ENABLED:false}
    api-base-uri: ${ERP_FEISHU_API_BASE_URI:https://open.feishu.cn}
    authorization-uri: ${ERP_FEISHU_AUTHORIZATION_URI:https://accounts.feishu.cn/open-apis/authen/v1/authorize}
    connect-timeout: ${ERP_FEISHU_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${ERP_FEISHU_REQUEST_TIMEOUT:PT5S}
  file:
    storage:
      provider: ${ERP_FILE_STORAGE_PROVIDER:local}
