spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${ERP_DB_URL}
    username: ${ERP_DB_USERNAME}
    password: ${ERP_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
erp:
  auth:
    session-ttl: ${ERP_AUTH_SESSION_TTL:PT12H}
    ticket-ttl: ${ERP_AUTH_TICKET_TTL:PT60S}
  feishu:
    enabled: ${ERP_FEISHU_ENABLED:false}
    app-id: ${ERP_FEISHU_APP_ID:}
    app-secret: ${ERP_FEISHU_APP_SECRET:}
    redirect-uri: ${ERP_FEISHU_REDIRECT_URI:}
    allowed-tenant-key: ${ERP_FEISHU_ALLOWED_TENANT_KEY:}
    mock-enabled: ${ERP_FEISHU_MOCK_ENABLED:false}
    api-base-uri: ${ERP_FEISHU_API_BASE_URI:https://open.feishu.cn}
    authorization-uri: ${ERP_FEISHU_AUTHORIZATION_URI:https://accounts.feishu.cn/open-apis/authen/v1/authorize}
    connect-timeout: ${ERP_FEISHU_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${ERP_FEISHU_REQUEST_TIMEOUT:PT5S}
  file:
    storage:
      provider: ${ERP_FILE_STORAGE_PROVIDER:local}
